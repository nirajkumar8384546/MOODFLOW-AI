<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register - MOODFLOW AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>

<body>

    {% include 'header.html' %}

    <!-- 🔥 CENTER CONTENT -->
    <div class="main_container">
        <div class="form_container">

            <h2>📝 Register</h2>

            <!-- 🔥 FLASH MESSAGE -->
            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="flash">
                {% for msg in messages %}
                {{ msg }}
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form action="{{ url_for('auth_bp.register') }}" method="POST">

                <input type="text" name="username" placeholder="👤 Username" required>

                <input type="email" name="email" placeholder="📧 Email" required>

                <div class="toggle-pass">
                    <input type="password" id="pass1" name="password" placeholder="🔑 Password" required>
                    <span onclick="togglePass('pass1')">Show</span>
                </div>

                <div class="toggle-pass">
                    <input type="password" id="pass2" placeholder="🔒 Confirm Password" required>
                    <span onclick="togglePass('pass2')">Show</span>
                </div>

                <button type="submit">Register</button>

                <div class="link">
                    Already have an account?
                    <a href="{{ url_for('auth_bp.login') }}">Login</a>
                </div>

            </form>

        </div>
    </div>

    {% include 'footer.html' %}

    <script>
        function togglePass(id) {
            const input = document.getElementById(id);
            input.type = input.type === "password" ? "text" : "password";
        }
    </script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
