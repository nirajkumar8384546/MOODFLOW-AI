<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Update Profile - MOODFLOW AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/update_profile.css') }}">
</head>

<body>

    {% include 'header.html' %}

    <div class="main_container">
        <div class="profile_card">
            <h2>👤 Update Profile</h2>

            <form method="POST" enctype="multipart/form-data">

                <div class="profile-pic">
                    <img id="preview"
                        src="{{ url_for('static', filename='uploads/' + (user.profile_pic or 'default.png')) }}?v={{ user.profile_pic or '1' }}">
                    <input type="file" name="profile_pic" onchange="previewImage(event)">
                </div>

                <!-- INPUTS -->
                <input type="text" name="username" placeholder="Username" value="{{ user.username or '' }}">

                <input type="email" name="email" placeholder="Email" value="{{ user.email or '' }}">

                <input type="text" name="phone" placeholder="Phone Number" value="{{ user.phone or '' }}">

                <!--DOB-->
                <input type="date" name="dob" value="{{ user.dob.strftime('%Y-%m-%d') if user.dob else '' }}">

                <!-- SELECT -->
                <select name="gender" required>
                    <option value="" disabled {% if not user.gender %}selected{% endif %}>Select Gender</option>
                    <option value="Male" {% if user.gender=="Male" %}selected{% endif %}>Male</option>
                    <option value="Female" {% if user.gender=="Female" %}selected{% endif %}>Female</option>
                </select>

                <textarea name="address" placeholder="Address">{{ user.address or '' }}</textarea>

                <textarea name="bio" placeholder="Bio">{{ user.bio or '' }}</textarea>

                <button type="submit">Update Profile</button>

            </form>
        </div>
    </div>

    {% include 'footer.html' %}

    <script>
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function () {
                document.getElementById('preview').src = reader.result;
            }
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>

</html>
